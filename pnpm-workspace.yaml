packages:
  - "packages/*"
  - "sites/*"

# EmDash and its Cloudflare host are pinned to 1.0.1. There are no host
# overrides or local vendor tarballs. The one-copy host contract is checked by
# sites/staging/test/host-pin.test.ts; any upgrade must keep the host and bridge
# on the same tested dependency train.
# pnpm 11 workspace overrides, if needed, belong here rather than package.json.

allowBuilds:
  better-sqlite3: true
  # esbuild's postinstall only validates the preinstalled platform binary —
  # wrangler and the Astro toolchain (sites/staging) bundle through it.
  esbuild: true
  # Keep sharp install scripts disabled; the reference build uses the locked
  # platform packages. Qualify changes to this build policy with the host build.
  sharp: false
  workerd: true

catalog:
  typescript: ^5.9.3
  vitest: ^4.1.10
  tsdown: ^0.22.4
  oxlint: ^1.73.0
  oxfmt: ^0.58.0
  kysely: ^0.29.3
  pg: ^8.22.0
  "@types/pg": ^8.20.0
  better-sqlite3: ^12.11.1
  "@types/better-sqlite3": ^7.6.13
  zod: ^4.4.3
  hono: ^4.12.29
  "@hono/node-server": ^2.0.8
  dependency-cruiser: ^18.0.0
  # wrangler ^4.68 -> ^4.99 because `@emdash-cms/cloudflare` declares
  # `peerDependencies.wrangler >= 4.99.0`.
  wrangler: ^4.99.0
  "@changesets/cli": ^2.31.0
  "@types/node": ^22.15.0
  fast-check: ^3.23.2
  "@playwright/test": ^1.62.1

minimumReleaseAgeExclude:
  - hono@4.12.29
  # The D1 test tier's toolchain (`@cloudflare/vitest-plugin`), which pins its own
  # wrangler/miniflare exactly and therefore its own workerd — see the "D1 tier"
  # section of `packages/store-emdash/README.md`.
  - "@cloudflare/vitest-plugin@1.1.8"
  - "wrangler@4.131.1"
  - "miniflare@5.20260911.0-alpha"
  - workerd@1.20260710.1 || 1.20260911.1
  - "@cloudflare/workerd-darwin-64@1.20260710.1 || 1.20260911.1"
  - "@cloudflare/workerd-darwin-arm64@1.20260710.1 || 1.20260911.1"
  - "@cloudflare/workerd-linux-64@1.20260710.1 || 1.20260911.1"
  - "@cloudflare/workerd-linux-arm64@1.20260710.1 || 1.20260911.1"
  - "@cloudflare/workerd-windows-64@1.20260710.1 || 1.20260911.1"
  # Nothing in this repo sets `minimumReleaseAge`, so this list only has an
  # effect under external pnpm config (a user or CI `.npmrc`) that does.
  #
  # The whole EmDash train is listed now. It used to omit `emdash`,
  # `@emdash-cms/admin`, `@emdash-cms/cloudflare` and `@emdash-cms/registry-client`
  # because they came from `vendor/` as `file:` tarballs, which bypass the
  # release-age check entirely; they resolve from the registry again, so they
  # need the exclusion like every sibling. New pinned host releases may be younger than a
  # typical threshold.
  - "emdash@1.0.1"
  - "@emdash-cms/admin@1.0.1"
  - "@emdash-cms/auth@1.0.1"
  - "@emdash-cms/blocks@1.0.1"
  - "@emdash-cms/cloudflare@1.0.1"
  - "@emdash-cms/gutenberg-to-portable-text@1.0.1"
  - "@emdash-cms/plugin-types@0.3.1 || 0.5.0"
  - "@emdash-cms/registry-client@0.6.0 || 0.7.0"
  - "@emdash-cms/registry-lexicons@0.5.0 || 0.7.0"
  - "@emdash-cms/registry-moderation@0.2.0"
  - "@emdash-cms/registry-verification@0.3.1 || 0.3.3"
